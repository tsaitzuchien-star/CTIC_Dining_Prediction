name: 更新天氣資料

# 台灣時間 07:50、08:50、09:40、12:50（UTC 前一天 23:50、00:50、01:40、04:50）各抓一次；GitHub 排程可能延遲數分鐘
on:
  schedule:
    - cron: '50 23 * * 0-4'
    - cron: '50 0 * * 1-5'
    - cron: '40 1 * * 1-5'
    - cron: '50 4 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_weather.py'
      - '.github/workflows/weather.yml'

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_weather.py
      - name: 有變動才提交
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data/weather.csv
          git diff --cached --quiet || (git commit -m "更新天氣資料" && git push)
